name: Tests and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: PHP syntax and behavior
        run: |
          find . -path ./node_modules -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/render.php
          php tests/render.php --autosave
          php tests/updates.php
      - run: npm test
      - run: npm run audit:duplicates
      - run: npm run audit:dead-code
      - name: Chrome SVG and animation checks
        if: matrix.php == '8.3'
        run: npm run test:browser
      - run: npm run build
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify tag matches plugin version
        run: node -e "if ('v' + require('./package.json').version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - run: npm run build
      - uses: softprops/action-gh-release@v2
        with:
          name: WP Animted Counter ${{ github.ref_name }}
          body_path: RELEASE-NOTES.md
          files: |
            dist/wp-animated-counter-*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
